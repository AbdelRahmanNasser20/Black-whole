[project]
name = "listing-automation"
version = "0.1.0"
description = "GovDeals -> FB Marketplace + eBay draft automation"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "httpx>=0.27",
    "boto3>=1.34",          # Cloudflare R2 (S3-compatible) image storage — zero egress fees
    "click>=8.1",
    "pillow>=9.5",
    "google-genai>=0.3",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "tzdata>=2024.1",
    "itsdangerous>=2.1",    # signed 365-day session/device cookies — "auth once" (BLACKWHOLE-14)
    "pyotp>=2.9",           # optional TOTP second factor (BLACKWHOLE-14)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
extractors = [
    "openai>=1.0",
    "openpyxl>=3.1",
    "claude-agent-sdk>=0.1.50",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automation*", "auction_extractors*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
