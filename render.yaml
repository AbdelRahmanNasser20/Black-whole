# Render Blueprint for the black-whole.com cloud deploy (discovery-only).
#
# Two services off one Docker image:
#   1. web  — the stateless FastAPI app (public site + admin), reads Supabase.
#   2. cron — daily GovDeals discovery scrape (maestro JSON API) → Supabase sync.
#
# Secrets (BLACKWHOLE_DB_URL + LLM keys) live in the `blackwhole-secrets` env
# group — set their VALUES in the Render dashboard once; nothing secret is
# committed here. Apply with: Render dashboard → New → Blueprint → this repo.

envVarGroups:
  - name: blackwhole-secrets
    envVars:
      - key: BLACKWHOLE_DB_URL      # Supabase Session pooler URL (required)
        sync: false
      - key: OPENAI_API_KEY         # optional; Auctions condition scoring
        sync: false
      - key: GROQ_API_KEY           # quantity refine LLM (provider=groq)
        sync: false
      - key: GEMINI_API_KEY         # optional alternate LLM for the app
        sync: false
      # Supabase Storage — durable listing images (BLACKWHOLE-6). Reads of the
      # public listing-images bucket need NO key, so the live site renders images
      # without these. Set the KEY only if a cloud-side job ever uploads images.
      - key: SUPABASE_STORAGE_URL   # https://nihgzltpjriekyqqucbd.supabase.co
        sync: false
      - key: SUPABASE_STORAGE_KEY   # storage write key (only for cloud uploads)
        sync: false
      - key: LISTING_IMAGES_BUCKET  # listing-images
        sync: false
      # Cloudflare R2 — the CANONICAL image backend. Supabase Storage above is
      # 402-restricted (over free-tier quota) and serves nothing, so without
      # these five the cloud archiver has no working destination: env_config()
      # returns None and deals/archive.py falls back to a bucket that 402s.
      # R2 has zero egress fees. Values live in the dashboard, never here.
      - key: R2_ACCOUNT_ID          # Cloudflare account id
        sync: false
      - key: R2_ACCESS_KEY_ID       # R2 S3-API access key
        sync: false
      - key: R2_SECRET_ACCESS_KEY   # R2 S3-API secret
        sync: false
      - key: R2_BUCKET              # listing-images
        sync: false
      - key: R2_PUBLIC_BASE         # https://pub-<hash>.r2.dev (or custom domain)
        sync: false
      - key: TELEGRAM_BOT_TOKEN     # deals digests + margin/relist alerts
        sync: false
      - key: TELEGRAM_CHAT_ID       # -100… "BlackWhole Alerts" supergroup id (BLACKWHOLE-24)
        sync: false
      # Forum-topic routing (BLACKWHOLE-24): each value is the message_thread_id
      # of a tab in the supergroup. Set these in the dashboard TOGETHER WITH the
      # new group TELEGRAM_CHAT_ID; empty = post to the group's General topic.
      - key: TELEGRAM_TOPIC_LEADS   # new inquiries + alert signups
        sync: false
      - key: TELEGRAM_TOPIC_DEALS   # margin/relist/digest/saved-search/sourcing/countdowns
        sync: false
      - key: TELEGRAM_TOPIC_HEALTH  # scrape degradation + poller crashes
        sync: false
      - key: TELEGRAM_TOPIC_POLLER  # FB poller chatter (used by the poller repo)
        sync: false
      - key: COMPS_URL              # Pi sold-comps service (tunnel URL)
        sync: false
      - key: COMPS_KEY
        sync: false
      - key: GSA_API_KEY            # recorder's gsa.py source (BLACKWHOLE-28 Phase 0);
        sync: false                 # falls back to the shared/rate-limited DEMO_KEY if unset

services:
  # ── 1. Always-on website ────────────────────────────────────────────────
  - type: web
    name: black-whole-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # always-on; bump if needed
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - fromGroup: blackwhole-secrets
      - key: LISTING_WEB_HOST
        value: 0.0.0.0
      - key: LISTING_WEB_RELOAD
        value: "0"
      # PORT is injected by Render; the Docker CMD maps it to LISTING_WEB_PORT.
      # ── "auth once" 365-day dashboard login (BLACKWHOLE-14) ──
      # UNSET = auth disabled (admin surface stays open, pre-feature behavior).
      # See docs/CLOUDFLARE_365D_LOGIN.md for the full operator runbook.
      - key: ADMIN_PASSWORD    # first factor; UNSET = login disabled (no-op)
        sync: false
      - key: SESSION_SECRET    # signs the 365-day session cookie; unset =
        sync: false            # per-boot random key (everyone logged out on deploy)
      - key: TOTP_SECRET       # OPTIONAL TOTP once-per-device (scripts/totp_provision.py)
        sync: false

  # ── 2. Daily discovery scrape → Supabase ────────────────────────────────
  - type: cron
    name: black-whole-discovery
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 8 * * *"    # 08:00 UTC daily
    autoDeploy: true
    # A committed script avoids the nested-quote mangling that broke the inline
    # `sh -c "... && ..."` form (every run exited 127). See scripts/run_discovery.sh.
    dockerCommand: sh scripts/run_discovery.sh
    envVars:
      - fromGroup: blackwhole-secrets
      - key: GOVDEALS_USE_API
        value: "1"           # JSON API path (proven from datacenter IPs)
      - key: PUBLICSURPLUS_USE_API
        value: "1"           # PS plain-HTTP path; this image has no Chromium
      - key: PUBLICSURPLUS_ALLOW_BROWSER
        value: "0"           # no Chromium here — degrade, never launch+crash
      - key: LLM_PROVIDER
        value: groq          # quantity refine via Groq API (llama-3.3-70b)
      - key: LISTINGS_DB_PATH
        value: /tmp/listings.db   # ephemeral staging buffer; Supabase is durable

  # ── 3. Deals tracker — continuous loop (2026-07-17 spec) ────────────────
  - type: cron
    name: deals-discover
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "15 */6 * * *"     # every 6h
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh discover --categories all --max-pages 200
    envVars:
      - fromGroup: blackwhole-secrets
      # Explicit rather than relying on auto-order, so adding a CEREBRAS key
      # later can't silently move ~3,100 calls/day onto a billed account.
      - key: DEALS_LLM_PROVIDER
        value: groq
  - type: cron
    name: deals-watch
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/20 * * * *"     # every 20 min
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh watch-once
    envVars:
      - fromGroup: blackwhole-secrets
  - type: cron
    name: deals-bidders
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Every 30 min. GovDeals keeps no bid history, so a lead change only exists
    # while it's live — an hourly cadence would silently lose most of them.
    # Targets are ordered soonest-closing first, so the LIMIT drops the lots
    # that are still days out (and will be picked up on a later pass), never
    # the ones about to close.
    schedule: "*/30 * * * *"
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh track-bidders --category all --title-like chair --min-bids 1 --limit 150
    envVars:
      - fromGroup: blackwhole-secrets
  - type: cron
    name: deals-backfill-classify
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Drains the ~41k lots left unclassified by the str.format bug (every call
    # raised KeyError before reaching the network; a bare except stored
    # `other`/0.0). 450/hour ≈ 10,800/day sits under Groq's free 14,400 req/day
    # with room for the discovery sweep's own ~3,100. Self-terminating: once
    # nothing is pending the run prints "nothing pending" and exits 0, so this
    # can stay scheduled forever rather than needing to be remembered and
    # removed.
    schedule: "30 * * * *"
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh backfill-classify --limit 450 --rpm 18
    envVars:
      - fromGroup: blackwhole-secrets
      - key: DEALS_LLM_PROVIDER
        value: groq
  - type: cron
    name: deals-analyze
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "45 * * * *"       # hourly
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh analyze
    envVars:
      - fromGroup: blackwhole-secrets
      # Was hardcoded to gemini-2.5-flash and died with that key's prepay
      # balance. Its prompts are ~5x the classify prompt, so the provider paces
      # on estimated tokens — 50 lots/hour lands well inside the free tier.
      - key: DEALS_LLM_PROVIDER
        value: groq
  - type: cron
    name: deals-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *"       # 13:00 UTC ≈ 9am ET
    autoDeploy: true
    dockerCommand: sh scripts/deals_cron.sh digest
    envVars:
      - fromGroup: blackwhole-secrets

  # ── 4. Closing-price recorder (BLACKWHOLE-28 Phase 0) ───────────────────
  # Every day without a recorder is a day of comps lost forever — closing
  # prices can't be backfilled. `run` does poll-once (adaptive cadence, down
  # to 5-min inside the final hour of a closing lot) + conditional discover
  # for any of the 6 sources gone stale. 5-min cadence exists to catch
  # closes; drop to */10 if Render cron cost becomes a concern.
  - type: cron
    name: recorder-run
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"      # every 5 min
    autoDeploy: true
    # --discover-stale-hours 12 (up from the CLI default of 6): discover()
    # has no change-gating yet, so every stale-refresh re-INSERTs a fresh
    # row for every active lot it finds — a gentler cadence buys storage
    # headroom until that's measured and fixed (see recorder/README.md's
    # "Storage" section for the actual pg_total_relation_size numbers).
    dockerCommand: ./scripts/recorder_cron.sh run --discover-stale-hours 12
    envVars:
      - fromGroup: blackwhole-secrets
